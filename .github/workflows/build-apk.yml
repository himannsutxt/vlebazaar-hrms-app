name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Use the most recently committed .zip (any name, e.g. "android_app (1).zip")
      - name: Unpack newest app zip
        run: |
          Z=$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)
          echo "Using: $Z"
          mkdir app && unzip -q "$Z" -d app
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build
        working-directory: app
        run: bash build.sh
      - name: Name the APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk VleBazaar-EMS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vlebazaar-hrms-apk
          path: VleBazaar-EMS.apk
      # Public direct link: https://github.com/himannsutxt/vlebazaar-hrms-app/releases/latest/download/VleBazaar-EMS.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VleBazaar EMS build ${{ github.run_number }}
          make_latest: true
          files: VleBazaar-EMS.apk

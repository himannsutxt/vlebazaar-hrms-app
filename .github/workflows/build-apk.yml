name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir app && unzip -q android_app.zip -d app
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build
        working-directory: app
        run: |
          flutter create --platforms=android --org com.vlebazaar --project-name vlebazaar_hrms .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="VLEBAZAAR HRMS"#' $M
          sed -i 's/minSdk = .*/minSdk = 23/; s/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle* || true
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vlebazaar-hrms-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

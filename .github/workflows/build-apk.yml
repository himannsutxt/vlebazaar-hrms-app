name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo holds the app source as android_app.zip (or unzipped at the root)
      - run: if [ -f android_app.zip ]; then mkdir app && unzip -q android_app.zip -d app; else mkdir app && cp -r $(ls -A | grep -v '^app$' | grep -v '^.git$') app/; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build
        working-directory: app
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vlebazaar-hrms-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

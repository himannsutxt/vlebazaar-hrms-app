name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Use the most recently committed .zip (any name, e.g. "android_app (1).zip")
      - name: Unpack newest app zip
        run: |
          Z=$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)
          echo "Using: $Z"
          mkdir app && unzip -q "$Z" -d app
          grep -q "assets/splash" app/pubspec.yaml && echo "splash: yes" || echo "splash: no (old zip?)"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build
        working-directory: app
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vlebazaar-hrms-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
